# ==================== 服务器端口配置 ====================
server:
  port: 8081

spring:
  application:
    # 应用名称
    name: blog

  # ==================== MySQL 数据源配置 ====================
  datasource:
    # JDBC 连接地址（blogs 数据库）
    # useUnicode=true             — 使用 Unicode 字符集
    # characterEncoding=utf-8     — 字符编码为 UTF-8
    # useSSL=false                — 关闭 SSL（本地开发环境无需加密连接）
    # serverTimezone=Asia/Shanghai— 服务端时区设为东八区
    # allowPublicKeyRetrieval=true— 允许客户端从服务器获取公钥
    # allowMultiQueries=true      — 允许一次执行多条 SQL
    url: jdbc:mysql://localhost:3306/blogs?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true
    # 数据库用户名
    username: root
    # 数据库密码
    password:
    # MySQL JDBC 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== JPA / Hibernate 配置 ====================
  jpa:
    # 数据库方言（MySQL 8.x 适用）
    database-platform: org.hibernate.dialect.MySQLDialect
    # 控制台打印 SQL 语句（开发环境建议开启）
    show-sql: true
    hibernate:
      # DDL 自动建表策略：
      #   update  — 自动根据实体类更新表结构，保留已有数据（开发环境推荐）
      #   create  — 每次启动重建表，会清空数据
      #   validate — 仅校验实体类与表结构是否一致，不做修改（生产环境推荐）
      #   none    — 不做任何 DDL 操作
      ddl-auto: update
    properties:
      hibernate:
        # 格式化 SQL 输出，便于阅读
        format_sql: true

# ==================== JWT 配置 ====================
jwt:
  # 签名密钥（HS256 算法要求至少 32 字节，生产环境请替换为高强度随机密钥）
  secret: syt-blog-secret-key-please-do-not-use-in-production-2024
  # Token 过期时间（毫秒），86400000 = 24 小时
  access-expiration: 900000
  refresh-expiration: 604800000

# ==================== 阿里云 OSS 配置 ====================
oss:
  # 地域 ID（需与 Bucket 所在区域一致，如 cn-hangzhou、cn-shanghai）
  region: cn-beijing
  # AccessKey ID（阿里云控制台 RAM 访问密钥，注意保密，勿提交到公共仓库）
  access-key-id:
  # AccessKey Secret（阿里云控制台 RAM 访问密钥，注意保密，勿提交到公共仓库）
  access-key-secret:
  # Bucket 名称
  bucket: hmleadnews110
  # 公开访问 URL 前缀（需开启 Bucket 公共读，格式：https://{bucket}.oss-{region}.aliyuncs.com，结尾不要加 /）
  url-prefix: https://hmleadnews110.oss-cn-beijing.aliyuncs.com
